[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "economic-cycle-monitor"
version = "0.1.0"
description = "Foundation for a personal multi-agent global economic-cycle monitoring system."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Project Owner" }]
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "python-dateutil>=2.9,<3",
  "PyYAML>=6.0,<7",
  "sqlalchemy>=2.0.36,<3",
  "structlog>=24.4,<26",
  "typer>=0.15,<1",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
  "types-python-dateutil>=2.9,<3",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
economic-cycle-monitor = "app.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["app", "agents"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra -m 'not live'"
testpaths = ["tests"]
markers = [
  "integration: requires a reachable PostgreSQL 16-compatible database",
  "live: explicitly permitted tests that may call a real external API",
]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]
"app/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "agents"]

[tool.pydantic-mypy]
init_forbid_extra = true
warn_required_dynamic_aliases = true
