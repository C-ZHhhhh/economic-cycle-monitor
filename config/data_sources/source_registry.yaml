schema_version: "1.0.0"
registry_policy_version: "stage2b5-v1"

# Anchors remove repetition only. PyYAML resolves every merged value before the
# strict Pydantic contract is validated and hashed.
templates:
  fallback_official: &fallback_official
    allowed_reasons: [PRIMARY_BEFORE_OFFICIAL_HISTORY, PRIMARY_STALE_BEYOND_GRACE, PRIMARY_TEMPORARILY_UNAVAILABLE]
    recovery_policy: {require_valid_identity: true, require_expected_period: true, require_successful_sync: true, require_conflict_free_overlap: true}
    hysteresis: {mode: STATELESS_MVP, durable_transition_state: false}
  fallback_none: &fallback_none
    allowed_reasons: []
    recovery_policy: {require_valid_identity: true, require_expected_period: true, require_successful_sync: true, require_conflict_free_overlap: true}
    hysteresis: {mode: STATELESS_MVP, durable_transition_state: false}
  vintage_unverified: &vintage_unverified {source: ALFRED_VINTAGE, capability: ALFRED_PROXY_VINTAGE_UNVERIFIED, granularity: date, backtest_safety: UNVERIFIED}
  vintage_gdp: &vintage_gdp {source: ALFRED_VINTAGE, capability: ALFRED_PROXY_VINTAGE, granularity: date, backtest_safety: VALIDATED_DATE_ONLY, validated_as_of_dates: [2020-06-30]}
  fresh_bls: &fresh_bls {schedule_type: BLS_PROGRAM_RELEASE_CALENDAR, expected_lag_days: 35, grace_days: 14, stale_policy: DEGRADE_WITHIN_GRACE_THEN_STALE, legacy_ceiling_days: 105}
  fresh_bea_monthly: &fresh_bea_monthly {schedule_type: BEA_PERSONAL_INCOME_OUTLAYS_CALENDAR, expected_lag_days: 35, grace_days: 14, stale_policy: DEGRADE_WITHIN_GRACE_THEN_STALE, legacy_ceiling_days: 95}
  fresh_bea_quarterly: &fresh_bea_quarterly {schedule_type: BEA_GDP_RELEASE_CALENDAR, expected_lag_days: 40, grace_days: 21, stale_policy: DEGRADE_WITHIN_GRACE_THEN_STALE, legacy_ceiling_days: 225}
  fresh_census: &fresh_census {schedule_type: CENSUS_PROGRAM_RELEASE_CALENDAR, expected_lag_days: 45, grace_days: 15, stale_policy: DEGRADE_WITHIN_GRACE_THEN_STALE, legacy_ceiling_days: 115}
  fresh_fed: &fresh_fed {schedule_type: FEDERAL_RESERVE_RELEASE_CALENDAR, expected_lag_days: 35, grace_days: 14, stale_policy: DEGRADE_WITHIN_GRACE_THEN_STALE, legacy_ceiling_days: 110}
  fresh_dol: &fresh_dol {schedule_type: DOL_WEEKLY_CLAIMS_THURSDAY, expected_lag_days: 5, grace_days: 21, stale_policy: DEGRADE_WITHIN_GRACE_THEN_STALE, legacy_ceiling_days: 28}
  fresh_fred: &fresh_fred {schedule_type: FRED_PROVIDER_STATUS_DRIVEN, expected_lag_days: 45, grace_days: 15, stale_policy: DEGRADE_WITHIN_GRACE_THEN_STALE, legacy_ceiling_days: 95}
  revision_cpi: &revision_cpi
    recent_reconciliation: {strategy: rolling_window, window_months: 18}
    annual_or_benchmark_reconciliation: {strategy: annual_seasonal_recalculation, window_years: 5}
    deep_reconciliation: {strategy: event_driven_full_history}
  revision_ppi: &revision_ppi
    recent_reconciliation: {strategy: rolling_window, window_months: 4}
    annual_or_benchmark_reconciliation: {strategy: not_applicable}
    deep_reconciliation: {strategy: event_driven_full_history}
  revision_ces: &revision_ces
    recent_reconciliation: {strategy: monthly_preliminary_revision, window_months: 3}
    annual_or_benchmark_reconciliation: {strategy: annual_benchmark_and_seasonal, window_years: 5}
    deep_reconciliation: {strategy: event_driven_full_history}
  revision_cps: &revision_cps
    recent_reconciliation: {strategy: rolling_window, window_months: 12}
    annual_or_benchmark_reconciliation: {strategy: annual_controls_and_seasonal, window_years: 5}
    deep_reconciliation: {strategy: event_driven_full_history}
  revision_jolts: &revision_jolts
    recent_reconciliation: {strategy: monthly_preliminary_revision, window_months: 3}
    annual_or_benchmark_reconciliation: {strategy: annual_benchmark_and_seasonal, window_years: 5}
    deep_reconciliation: {strategy: event_driven_full_history}
  revision_bea: &revision_bea
    recent_reconciliation: {strategy: rolling_window, window_years: 5}
    annual_or_benchmark_reconciliation: {strategy: annual_nipa_update, window_years: 5}
    deep_reconciliation: {strategy: comprehensive_update_full_history}
  revision_census_m3: &revision_census_m3
    recent_reconciliation: {strategy: rolling_window, window_years: 5}
    annual_or_benchmark_reconciliation: {strategy: annual_benchmark, window_years: 5}
    deep_reconciliation: {strategy: benchmark_event_full_history}
  revision_census_nrc: &revision_census_nrc
    recent_reconciliation: {strategy: rolling_window, window_years: 2}
    annual_or_benchmark_reconciliation: {strategy: annual_revision, window_years: 2}
    deep_reconciliation: {strategy: revision_event_full_history}
  revision_census_mtis: &revision_census_mtis
    recent_reconciliation: {strategy: rolling_window, window_years: 5}
    annual_or_benchmark_reconciliation: {strategy: annual_survey_revision, window_years: 5}
    deep_reconciliation: {strategy: revision_event_full_history}
  revision_fed: &revision_fed
    recent_reconciliation: {strategy: full_official_release}
    annual_or_benchmark_reconciliation: {strategy: full_official_release}
    deep_reconciliation: {strategy: full_official_release_and_identity_revalidation}
  revision_dol: &revision_dol
    recent_reconciliation: {strategy: weekly_recent, window_days: 90}
    annual_or_benchmark_reconciliation: {strategy: annual_seasonal_reconciliation, window_years: 5}
    deep_reconciliation: {strategy: revision_event_full_history}
  revision_fred_monthly: &revision_fred_monthly
    recent_reconciliation: {strategy: rolling_window, window_months: 18}
    annual_or_benchmark_reconciliation: {strategy: alfred_change_audit, window_years: 5}
    deep_reconciliation: {strategy: event_driven_alfred_full_history}

