name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: macro_test
          POSTGRES_USER: macro
          POSTGRES_PASSWORD: macro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U macro -d macro_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://macro:macro@localhost:5432/macro_test
      TEST_DATABASE_URL: postgresql+psycopg://macro:macro@localhost:5432/macro_test
      LLM_MODE: mock
      SCHEDULER_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy app agents
      - run: pytest
