services:
  postgres:
    image: postgres:16-alpine
    container_name: economic-cycle-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-macro}
      POSTGRES_USER: ${POSTGRES_USER:-macro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-macro}
    ports:
      - "5432:5432"
    volumes:
      - macro_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command:
      - postgres
      - -c
      - max_connections=30
      - -c
      - shared_buffers=128MB
    deploy:
      resources:
        limits:
          memory: 512M
    mem_limit: 512m
    shm_size: 128mb

volumes:
  macro_postgres_data:
